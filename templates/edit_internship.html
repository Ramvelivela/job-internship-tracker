<!DOCTYPE html>
<html>
<head>
    <title>Edit Internship</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="form-page">

            <div class="form-header">
                <h1>Edit Internship</h1>
                <p>Update the details and application status of this internship.</p>
            </div>

            <form method="POST" class="job-form">

                <div class="form-group">
                    <label>Company Name</label>
                    <input
                        type="text"
                        name="company"
                        value="{{ internship['company'] }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Internship Role</label>
                    <input
                        type="text"
                        name="role"
                        value="{{ internship['role'] }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input
                        type="text"
                        name="location"
                        value="{{ internship['location'] }}"
                    >
                </div>

                <div class="form-group">
                    <label>Application Link</label>
                    <input
                        type="url"
                        name="link"
                        value="{{ internship['link'] }}"
                    >
                </div>

                <div class="form-group">
                    <label>Application Status</label>

                    <select name="status">
                        <option value="Pending" {% if internship["status"] == "Pending" %}selected{% endif %}>
                            Pending
                        </option>

                        <option value="Applied" {% if internship["status"] == "Applied" %}selected{% endif %}>
                            Applied
                        </option>

                        <option value="Interview" {% if internship["status"] == "Interview" %}selected{% endif %}>
                            Interview
                        </option>

                        <option value="Selected" {% if internship["status"] == "Selected" %}selected{% endif %}>
                            Selected
                        </option>

                        <option value="Rejected" {% if internship["status"] == "Rejected" %}selected{% endif %}>
                            Rejected
                        </option>
                    </select>
                </div>

                <div class="form-actions">

                    <button type="submit" class="primary-btn">
                        Update Internship
                    </button>

                    <a href="/" class="back-btn">
                        Back to Internships
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
