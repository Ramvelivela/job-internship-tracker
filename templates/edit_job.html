<!DOCTYPE html>
<html>
<head>
    <title>Edit Job</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="form-page">

            <div class="form-header">
                <h1>Edit Job</h1>
                <p>Update the details and application status of this job.</p>
            </div>

            <form method="POST" class="job-form">

                <div class="form-group">
                    <label>Company Name</label>
                    <input
                        type="text"
                        name="company"
                        value="{{ job['company'] }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Job Role</label>
                    <input
                        type="text"
                        name="role"
                        value="{{ job['role'] }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input
                        type="text"
                        name="location"
                        value="{{ job['location'] }}"
                    >
                </div>

                <div class="form-group">
                    <label>Application Link</label>
                    <input
                        type="url"
                        name="link"
                        value="{{ job['link'] }}"
                    >
                </div>

                <div class="form-group">
                    <label>Application Status</label>

                    <select name="status">

                        <option value="Saved"
                            {% if job["status"] == "Saved" %}selected{% endif %}>
                            Saved
                        </option>

                        <option value="Applied"
                            {% if job["status"] == "Applied" %}selected{% endif %}>
                            Applied
                        </option>

                        <option value="Assessment"
                            {% if job["status"] == "Assessment" %}selected{% endif %}>
                            Assessment
                        </option>

                        <option value="Interview"
                            {% if job["status"] == "Interview" %}selected{% endif %}>
                            Interview
                        </option>

                        <option value="Selected"
                            {% if job["status"] == "Selected" %}selected{% endif %}>
                            Selected
                        </option>

                        <option value="Rejected"
                            {% if job["status"] == "Rejected" %}selected{% endif %}>
                            Rejected
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Application Date</label>
                    <input
                        type="date"
                        name="application_date"
                        value="{{ job['application_date'] or '' }}"
                    >
                </div>

                <div class="form-group">
                    <label>Application Deadline</label>
                    <input
                        type="date"
                        name="deadline"
                        value="{{ job['deadline'] or '' }}"
                    >
                </div>

                <div class="form-group">
                    <label>Interview Date</label>
                    <input
                        type="date"
                        name="interview_date"
                        value="{{ job['interview_date'] or '' }}"
                    >
                </div>

                <div class="form-group">
                    <label>Follow-up Date</label>
                    <input
                        type="date"
                        name="follow_up_date"
                        value="{{ job['follow_up_date'] or '' }}"
                    >
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea
                        name="notes"
                        rows="4"
                        placeholder="Add notes about this application..."
                    >{{ job['notes'] or '' }}</textarea>
                </div>

                <div class="form-actions">

                    <button type="submit" class="primary-btn">
                        Update Job
                    </button>

                    <a href="/" class="back-btn">
                        Back to Jobs
                    </a>

                </div>

            </form>

        </div>

    </div>

    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
        }
    </script>

</body>
</html>
