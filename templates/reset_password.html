<!DOCTYPE html>
<html>
<head>

    <title>Reset Password</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>Reset Password</h1>

            <p>
                Enter your new password below.
            </p>


            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}


            <form
                method="POST"
                action="/reset-password"
            >

                <!-- EMAIL -->

                <input
                    type="hidden"
                    name="email"
                    value="{{ email }}"
                >


                <!-- RESET TOKEN -->

                <input
                    type="hidden"
                    name="reset_token"
                    value="{{ reset_token }}"
                >


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label>
                        New Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter new password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        required
                    >

                </div>


                <!-- RESET BUTTON -->

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Reset Password
                </button>

            </form>


            <p class="auth-link">

                <a href="/login">
                    ← Back to Login
                </a>

            </p>

        </div>

    </div>

</body>
</html>
